<main class="solo">
  <div class="panel solo__card">
    <span class="brand"><span class="brand__mark">{{template "icon" "board"}}</span>{{t "app.name"}}</span>
    <h1>{{t "auth.failed.title"}}</h1>
    <p class="muted">{{t "auth.failed.body"}}</p>
    <div class="actions"><a class="btn btn--primary" href="{{actionURL "login"}}">{{t "auth.failed.retry"}}</a></div>
  </div>
</main>
