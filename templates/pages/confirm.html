<section class="confirm-page">
  <h1>{{.Question}}</h1>
  <p class="muted">{{t "confirm.irreversible"}}</p>
  <form method="post" action="{{.Action}}" class="confirm-page__actions">
    {{csrfToken}}
    {{range .Fields}}<input type="hidden" name="{{.Name}}" value="{{.Value}}">{{end}}
    <input type="hidden" name="confirm" value="1">
    <a class="btn btn--secondary" href="{{.Back}}">{{t "confirm.cancel"}}</a>
    <button type="submit" class="btn btn--danger">{{t "confirm.yes"}}</button>
  </form>
</section>
