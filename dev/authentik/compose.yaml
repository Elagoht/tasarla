# A local Authentik for development: the same version as the test provider,
# with the kanban application, its OAuth2 provider and two users created by
# blueprints/kanban-dev.yaml. Start with `docker compose up -d` in this
# directory after creating .env (see ../README.md, "Yerel Authentik").
services:
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 5s
      retries: 10
    volumes:
      - database:/var/lib/postgresql/data
  server:
    image: ghcr.io/goauthentik/server:2026.8.3
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    environment: &env
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-kanban-admin}
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@example.com
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    ports:
      - "9000:9000"
    volumes:
      - ./blueprints:/blueprints/custom:ro
  worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    environment: *env
    volumes:
      - ./blueprints:/blueprints/custom:ro
volumes:
  database:
