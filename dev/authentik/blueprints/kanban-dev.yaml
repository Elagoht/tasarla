# The kanban application for local development. Mirrors the test provider:
# confidential client, RS256 signing key, claims in the ID token, hashed user
# id as the subject.
version: 1
metadata:
  name: Kanban (development)
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: kanban-provider
    identifiers:
      name: kanban-dev
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: kanban-dev
      client_secret: kanban-dev-secret
      sub_mode: hashed_user_id
      grant_types:
        - authorization_code
        - refresh_token
      include_claims_in_id_token: true
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:6060/auth/openid/authentik
          redirect_uri_type: authorization
        - matching_mode: strict
          url: http://localhost:6060/login
          redirect_uri_type: logout
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - model: authentik_core.application
    identifiers:
      slug: kanban-dev
    attrs:
      name: Kanban (dev)
      provider: !KeyOf kanban-provider
  - model: authentik_core.user
    identifiers:
      username: alice
    attrs:
      name: Alice
      email: alice@example.com
      password: kanban
  - model: authentik_core.user
    identifiers:
      username: bob
    attrs:
      name: Bob
      email: bob@example.com
      password: kanban
  # Like the test provider (amr: pwd): users without an authenticator are
  # not asked to set one up.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: skip
